name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Publish crate & GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches crate version
        run: |
          crate_version="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pretty-console") | .version')"
          tag_version="${GITHUB_REF_NAME}"
          echo "crate: ${crate_version}, tag: ${tag_version}"
          if [ "${crate_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${tag_version} does not match crate version ${crate_version}"
            exit 1
          fi

      - name: Run tests
        run: cargo test --all-targets

      - name: Generate changelog for this release
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: "--latest --strip header --config-url https://raw.githubusercontent.com/elcoosp/docs-toolkit/main/git-cliff/cliff.toml"
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGES.md
          generate_release_notes: false
